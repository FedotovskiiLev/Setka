name: Test and deploy isolated PWA channels
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages-channels
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read approved Betha tag
        id: versions
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('release-channels.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT,'betha=v'+c.betha.version+'\n');"
      - name: Checkout Betha release snapshot
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.versions.outputs.betha }}
          path: _betha
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix _betha
        if: github.event_name != 'pull_request'
      - name: Check official MIPT sources
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npm run sources:refresh
      - name: Build Betha release snapshot with current official data
        if: github.event_name != 'pull_request'
        run: |
          cp -a data/. _betha/data/
          (cd _betha && SETKA_CHANNEL=betha npm run build)
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks under project subpath
        env:
          PORT: 4175
          BASE_PATH: /Setka/
          TEST_URL: http://localhost:4175/Setka/
          BROWSER_CHANNEL: chromium
        run: |
          node server.mjs > /tmp/setka-server.log 2>&1 &
          node tests/browser.mjs
          node tests/update-browser.mjs
          node tests/notifications-browser.mjs
          node tests/installability-browser.mjs
          node tests/catalog-browser.mjs
          node tests/alpha-browser.mjs
          node tests/patch-browser.mjs
          node tests/zoom-browser.mjs
          node tests/study-browser.mjs
          node tests/mobile-today-browser.mjs
          node tests/feedback-browser.mjs
          node tests/planning-04-browser.mjs
          node tests/individual-browser.mjs
          node tests/workspace-browser.mjs
          node tests/settings-issues-browser.mjs
          node tests/study-dashboard-browser.mjs
      - name: Assemble and verify channel isolation in one browser profile
        env:
          TEST_URL: http://localhost:4175/Setka/
          BROWSER_CHANNEL: chromium
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/assemble-channels.mjs
          else
            node scripts/assemble-channels.mjs --frozen-stable _betha
          fi
          node tests/channels-browser.mjs
          TEST_CHANNEL=betha TEST_URL="${TEST_URL}betha/" node tests/settings-issues-browser.mjs
          TEST_CHANNEL=betha TEST_URL="${TEST_URL}betha/" node tests/study-dashboard-browser.mjs
          TEST_URL="${TEST_URL}betha/" node tests/betha-onboarding-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/*.png
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
