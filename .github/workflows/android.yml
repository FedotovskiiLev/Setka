name: Signed Android channel APKs
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md', 'tests/*browser.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to verify without publishing
        required: true
        default: unstable
        type: choice
        options: [stable, unstable, betha]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select and validate the channel
        id: channel
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            case "$GITHUB_REF_NAME" in
              *-unstable.*) channel=unstable ;;
              *-betha.*) channel=betha ;;
              *) channel=stable ;;
            esac
          else
            channel="${REQUESTED_CHANNEL:-unstable}"
          fi
          SETKA_CHANNEL="$channel" node scripts/check-unstable-release.mjs
          version="$(CHANNEL="$channel" node -e "console.log(require('./release-channels.json')[process.env.CHANNEL].version)")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  apk:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    env:
      SETKA_CHANNEL: ${{ needs.select.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 2bd0b444ab1dc6c0e3abd244b29a68dc338d0593
          path: _stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: node scripts/check-unstable-release.mjs
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Restore protected release signing key
        env:
          KEYSTORE: ${{ secrets.SETKA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/setka-release.jks"
      - name: Build signed selected channel APK
        env:
          SETKA_KEYSTORE_PATH: ${{ runner.temp }}/setka-release.jks
          SETKA_STORE_PASSWORD: ${{ secrets.SETKA_STORE_PASSWORD }}
          SETKA_KEY_ALIAS: ${{ secrets.SETKA_KEY_ALIAS }}
          SETKA_KEY_PASSWORD: ${{ secrets.SETKA_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Verify retained signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -F "$(cat android/release-certificate.sha256)" "$RUNNER_TEMP/certificate.txt"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device integration checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SETKA_KEYSTORE_PATH: ${{ runner.temp }}/setka-release.jks
          SETKA_STORE_PASSWORD: ${{ secrets.SETKA_STORE_PASSWORD }}
          SETKA_KEY_ALIAS: ${{ secrets.SETKA_KEY_ALIAS }}
          SETKA_KEY_PASSWORD: ${{ secrets.SETKA_KEY_PASSWORD }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/check-android-release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results-${{ needs.select.outputs.channel }}-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            /tmp/setka-upgrade-seed.txt
            /tmp/setka-native.txt
            /tmp/setka-reinstall.txt
            /tmp/setka-layout.txt
            /tmp/setka-time-picker.txt
            /tmp/setka-upgrade.txt
            /tmp/setka-isolation.txt
            /tmp/setka-study-status.txt
            /tmp/setka-status-reboot.txt
            /tmp/setka-status-logcat.txt
            /tmp/setka-screens/
      - uses: actions/upload-artifact@v4
        with:
          name: Setka-${{ needs.select.outputs.channel }}-Android-APK-${{ matrix.api }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/setka-release.jks"
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [select, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SETKA_CHANNEL: ${{ needs.select.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-unstable-release.mjs
      - uses: actions/download-artifact@v4
        with:
          name: Setka-${{ needs.select.outputs.channel }}-Android-APK-35
          path: apk
      - name: Publish gated signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_latest="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)"
          version="${GITHUB_REF_NAME#v}"
          mv apk/app-release.apk "apk/Setka-${version}.apk"
          notes="docs/${SETKA_CHANNEL}-release.md"
          test -f "$notes"
          if [ "$SETKA_CHANNEL" = stable ]; then
            flags=(--latest)
            title="Setka ${version}"
          else
            flags=(--prerelease --latest=false)
            title="Setka ${version} (${SETKA_CHANNEL})"
          fi
          gh release create "$GITHUB_REF_NAME" "apk/Setka-${version}.apk" --verify-tag "${flags[@]}" --title "$title" --notes-file "$notes"
          expected_latest="v$(node -p "require('./release-channels.json').stable.version")"
          actual_latest="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)"
          if [ "$SETKA_CHANNEL" = stable ]; then
            test "$actual_latest" = "$expected_latest"
          else
            test "$actual_latest" = "$previous_latest" || test "$actual_latest" = "$expected_latest"
          fi
